services:
  db:
    image: postgres:16-alpine
    container_name: watchless-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-watchless}
      POSTGRES_USER: ${DB_USER:-watchless}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-watchless}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - watchless_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-watchless} -d ${DB_NAME:-watchless}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: watchless-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - watchless_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  watchless_pg_data:
  watchless_redis_data:
