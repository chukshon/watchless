services:
  db:
    image: postgres:16-alpine
    container_name: watchless-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-watchless}
      POSTGRES_USER: ${DB_USER:-watchless}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-watchless}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - watchless_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-watchless} -d ${DB_NAME:-watchless}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  watchless_pg_data:
